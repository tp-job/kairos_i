<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Sun disc -->
  <circle cx="200" cy="240" r="120" fill="#C43A2E"/>
  <!-- Wave silhouette overlapping the sun -->
  <path d="M60 300 Q120 260 180 300 T300 300 T420 300 L420 360 L60 360 Z" fill="#F4EFE7"/>
  <!-- Horizon reflection strips (drawn from the sun's edge downward) -->
  <g fill="#C43A2E">
    <rect x="90" y="330" width="220" height="4" opacity="0.9"/>
    <rect x="100" y="340" width="200" height="3" opacity="0.6"/>
    <rect x="115" y="348" width="170" height="3" opacity="0.4"/>
    <rect x="130" y="354" width="140" height="2" opacity="0.25"/>
  </g>
  <!-- Birds -->
  <g fill="none" stroke="#1E1B18" stroke-width="3" stroke-linecap="round">
    <path d="M130 100 Q140 90 150 100 Q160 90 170 100"/>
    <path d="M180 80 Q188 72 196 80 Q204 72 212 80"/>
    <path d="M225 105 Q233 97 241 105 Q249 97 257 105"/>
    <path d="M260 130 Q268 122 276 130"/>
  </g>
</svg>
